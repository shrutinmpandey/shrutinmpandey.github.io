<header class="site-header">
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
    <ul class="nav-links">
      <li><a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="active"{% endif %}>Home</a></li>
      <li><a href="{{ '/experience/' | relative_url }}"{% if page.url contains "/experience" %} class="active"{% endif %}>Experience</a></li>
      <li><a href="{{ '/education/' | relative_url }}"{% if page.url contains "/education" %} class="active"{% endif %}>Education</a></li>
      <li><a href="{{ '/awards/' | relative_url }}"{% if page.url contains "/awards" %} class="active"{% endif %}>Awards</a></li>
      <li><a href="{{ '/projects/' | relative_url }}"{% if page.url contains "/projects" %} class="active"{% endif %}>Projects</a></li>
      <li><a href="{{ site.resume_url }}">Resume</a></li>
    </ul>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">🌓</button>
  </nav>
</header>
